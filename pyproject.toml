[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "p2pdocs"
version = "1.0.14"
description = "P2P Collaborative Text Editor using CRDT"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Muhammad Taaha", email = "taaha2004@gmail.com"}
]
keywords = ["p2p", "crdt", "collaborative", "editor", "text-editor", "peer-to-peer", "conflict-free"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Topic :: Communications",
    "Topic :: Text Editors",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

[project.urls]
Source = "https://github.com/taaha-0548/P2PDocs"

[project.scripts]
p2pdocs = "p2pdocs.cli:main"

[tool.setuptools]
packages = ["p2pdocs", "p2pdocs.crdt", "p2pdocs.network", "p2pdocs.storage", "p2pdocs.ui"]
