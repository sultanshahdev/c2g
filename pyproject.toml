[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "c2g"
version = "0.1.0"
description = "Code 2gether — peer-to-peer collaborative text editor using CRDT"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [{name = "c2g Contributors"}]
keywords = ["p2p", "crdt", "collaborative", "editor", "text-editor", "peer-to-peer", "conflict-free"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Topic :: Communications",
    "Topic :: Text Editors",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

[project.urls]
Source = "https://github.com/sultanshahdev/c2g"

[project.scripts]
c2g = "c2g.cli:main"

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
packages = ["c2g", "c2g.crdt", "c2g.network", "c2g.storage", "c2g.ui"]
